# ─────────────────────────────────────────────────────────────────────────────
# PR Validation — build, test, coverage gate, static analysis, dependency CVE
# scan, secret scan, and a container smoke test.
#
# STATUS: UNVALIDATED. Authored without executing (another agent owns the build
#         machine; concurrent `dotnet build` causes file-lock conflicts).
#         See docs/ops/05-cicd.md § "First-run validation checklist".
#
# WHY WINDOWS RUNNERS: TelegramAutoDownload.Tests targets net8.0-windows and
#   project-references the WPF app (TelegramAutoDownload.Tests.csproj:4,28), so
#   the unit-test suite cannot run on ubuntu-latest.
#
# WHY AN EPHEMERAL SOLUTION: the repo has no tracked .sln even though README.md
#   references `RunnerApp.sln` (README.md:111,120,298). We synthesise one in the
#   runner workspace so restore/build/analysis see every project. Nothing is
#   committed. Delete this step once a real .sln is tracked.
# ─────────────────────────────────────────────────────────────────────────────
name: PR Validation

on:
  pull_request:
    branches: [main, master, enterprise-readiness]
  push:
    branches: [main, master, enterprise-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pin to .NET 8 explicitly. The local dev SDK is 10.0.401 while every project
  # targets net8.0 / net8.0-windows — CI must not inherit that drift.
  # Once global.json is added (see docs/ops/05-cicd.md § global.json) switch the
  # setup-dotnet steps to `global-json-file: global.json`.
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # Coverage gate. Ratchet-only: raise this number, never lower it.
  # Start deliberately low — the real baseline is unknown until the first green run.
  COVERAGE_MINIMUM_LINE_PERCENT: "30"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Build + unit tests + coverage gate (Windows — net8.0-windows TFMs)
  # ───────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build & test (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show SDK version (drift guard)
        shell: pwsh
        run: |
          dotnet --info
          $sdk = (dotnet --version)
          if (-not $sdk.StartsWith('8.')) {
            Write-Error "Expected a .NET 8 SDK, got $sdk. All projects target net8.0/net8.0-windows."
            exit 1
          }

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Synthesise CI solution (no tracked .sln in repo)
        shell: pwsh
        run: |
          dotnet new sln -n TelegramAutoDownload-CI
          $projects = Get-ChildItem -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          if ($projects.Count -eq 0) { Write-Error "No .csproj files found"; exit 1 }
          foreach ($p in $projects) {
            Write-Host "sln add $($p.FullName)"
            dotnet sln TelegramAutoDownload-CI.sln add $p.FullName
          }
          dotnet sln TelegramAutoDownload-CI.sln list

      - name: Restore
        run: dotnet restore TelegramAutoDownload-CI.sln

      - name: Build (Release, warnings surfaced but not fatal yet)
        shell: pwsh
        run: |
          dotnet build TelegramAutoDownload-CI.sln `
            --configuration Release `
            --no-restore `
            -warnaserror:false `
            /p:ContinuousIntegrationBuild=true `
            /flp:LogFile=build-warnings.log;WarningsOnly

      - name: Publish build warning log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-warnings
          path: build-warnings.log
          if-no-files-found: ignore

      # UITests are FlaUI/UIA3 driven (TelegramAutoDownload.UITests.csproj:13) and
      # need an interactive desktop session. They are deliberately NOT part of the
      # PR gate — see docs/ops/05-cicd.md § "UI tests".
      - name: Unit tests with coverage
        shell: pwsh
        run: |
          dotnet test TelegramAutoDownload.Tests/TelegramAutoDownload.Tests.csproj `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=unit-tests.trx" `
            --logger "console;verbosity=normal" `
            --results-directory artifacts/test `
            --collect:"Code Coverage;Format=cobertura"

      - name: Coverage gate
        shell: pwsh
        run: |
          $min = [double]$env:COVERAGE_MINIMUM_LINE_PERCENT
          $reports = Get-ChildItem -Recurse -Path artifacts/test -Filter *.cobertura.xml -ErrorAction SilentlyContinue
          if (-not $reports) {
            Write-Error @"
          No Cobertura report produced.

          The test project does NOT reference coverlet.collector
          (TelegramAutoDownload.Tests.csproj:10-19), so this workflow relies on the
          Microsoft.CodeCoverage collector bundled with Microsoft.NET.Test.Sdk 17.9
          via --collect:"Code Coverage;Format=cobertura" (Windows-only).

          If this step fails on the first run, the fix is a one-line csproj change
          (add coverlet.collector) which THIS agent was not permitted to make.
          See docs/ops/05-cicd.md § "Coverage collector risk".
          "@
            exit 1
          }
          $best = 0.0
          foreach ($r in $reports) {
            [xml]$xml = Get-Content $r.FullName
            $rate = [double]$xml.coverage.'line-rate' * 100
            Write-Host ("{0}: {1:N2}% line coverage" -f $r.Name, $rate)
            if ($rate -gt $best) { $best = $rate }
          }
          "### Coverage: $([math]::Round($best,2))% (gate: $min%)" |
            Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($best -lt $min) {
            Write-Error ("Coverage {0:N2}% is below the gate of {1}%." -f $best, $min)
            exit 1
          }

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test/**
          if-no-files-found: warn

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit tests
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Dependency vulnerability + deprecation scan
  # ───────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency CVE scan
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Synthesise CI solution
        shell: pwsh
        run: |
          dotnet new sln -n TelegramAutoDownload-CI
          Get-ChildItem -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
            ForEach-Object { dotnet sln TelegramAutoDownload-CI.sln add $_.FullName }

      - name: Restore
        run: dotnet restore TelegramAutoDownload-CI.sln

      - name: Fail on High/Critical vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list TelegramAutoDownload-CI.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          $fence = '```'   # single quotes: backticks are literal in PowerShell
          @(
            '<details><summary>dotnet list package --vulnerable</summary>'
            ''
            $fence
            $out
            $fence
            '</details>'
          ) | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($out -match '(?im)^\s*>\s.*\b(High|Critical)\b') {
            Write-Error "High or Critical severity vulnerable NuGet package(s) detected."
            exit 1
          }
          Write-Host "No High/Critical vulnerable packages."

      - name: Report deprecated packages (advisory)
        continue-on-error: true
        shell: pwsh
        run: |
          $out = dotnet list TelegramAutoDownload-CI.sln package --deprecated --include-transitive 2>&1 | Out-String
          Write-Host $out
          $fence = '```'
          @('<details><summary>Deprecated packages</summary>', '', $fence, $out, $fence, '</details>') |
            Out-File -Append $env:GITHUB_STEP_SUMMARY

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Secret scanning
  # ───────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TruffleHog needs no licence key. --only-verified keeps false positives out
      # of the blocking path. Unverified findings are reported by the audit step.
      - name: TruffleHog (verified secrets — blocking)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified --fail --no-update

      - name: TruffleHog (unverified — advisory)
        continue-on-error: true
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=unknown,unverified --no-update

      # Gitleaks runs only when a licence secret is configured (required for orgs).
      - name: Detect Gitleaks licence
        id: gitleaks_cfg
        shell: bash
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: |
          if [ -n "${GITLEAKS_LICENSE:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gitleaks
        if: steps.gitleaks_cfg.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        uses: gitleaks/gitleaks-action@v2

      # Hard-coded-credential tripwires specific to this repo. These strings are
      # legitimate DEFAULTS in the shipped compose file / auth service
      # (docker-compose.yml:17-18, WebAuthService.cs:16) — the check exists to
      # catch them leaking into any NEW file.
      - name: Repo-specific credential tripwire
        shell: bash
        run: |
          set -o pipefail
          hits=$(grep -rInE 'api_hash\s*[:=]\s*["'"'"'][0-9a-f]{32}|APP_ID\s*[:=]\s*["'"'"']?[0-9]{6,}' \
                   --include='*.cs' --include='*.json' --include='*.yml' --include='*.yaml' \
                   --include='*.js' --include='*.md' . \
                 | grep -v 'abcdef1234567890abcdef1234567890' \
                 | grep -v '12345678' || true)
          if [ -n "$hits" ]; then
            echo "Possible real Telegram API credentials committed:"
            echo "$hits"
            exit 1
          fi
          echo "No Telegram API credential patterns found."

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Static analysis (advisory until the warning baseline is known)
  # ───────────────────────────────────────────────────────────────────────────
  static-analysis:
    name: Static analysis (advisory)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Synthesise CI solution
        shell: pwsh
        run: |
          dotnet new sln -n TelegramAutoDownload-CI
          Get-ChildItem -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
            ForEach-Object { dotnet sln TelegramAutoDownload-CI.sln add $_.FullName }

      - name: Restore
        run: dotnet restore TelegramAutoDownload-CI.sln

      # .NET analysers with AnalysisMode=Recommended. Advisory because the repo
      # has no .editorconfig and no analyser baseline — turning this red on day
      # one would block every PR. Promote to blocking once the count is zero.
      - name: Roslyn analysers
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build TelegramAutoDownload-CI.sln `
            --configuration Release --no-restore `
            /p:EnableNETAnalyzers=true `
            /p:AnalysisMode=Recommended `
            /p:EnforceCodeStyleInBuild=true `
            -warnaserror:false `
            /flp:LogFile=analysis.log;WarningsOnly

      - name: Summarise analyser findings
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path analysis.log) {
            $lines = Get-Content analysis.log
            $codes = $lines | Select-String -Pattern '\b(CA|CS|IDE|SA)\d{4}\b' -AllMatches |
              ForEach-Object { $_.Matches.Value } | Group-Object |
              Sort-Object Count -Descending | Select-Object -First 25
            "### Top analyser warnings`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "| Rule | Count |`n|---|---|" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            foreach ($c in $codes) { "| $($c.Name) | $($c.Count) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY }
          }

      - name: Dockerfile lint (advisory)
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Container build + smoke test (validates the Linux deployment surface)
  # ───────────────────────────────────────────────────────────────────────────
  container-smoke:
    name: Container build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: tad:pr-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the real ASP.NET host, which runs schema migrations
      # (Program.cs:105-108) and starts DownloadOrchestrator
      # (Program.cs:40). Catches migration and DI-wiring regressions.
      - name: Smoke test — boot, migrate, serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tad-data /tmp/tad-downloads
          docker run -d --name tad-smoke \
            -p 18080:8080 \
            -e DATA_DIR=/data \
            -e DOWNLOADS_DIR=/downloads \
            -e WEB_AUTH_ENABLED=false \
            -v /tmp/tad-data:/data \
            -v /tmp/tad-downloads:/downloads \
            tad:pr-${{ github.run_id }}

          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/api/web-auth/status || echo 000)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then ok=1; break; fi
            sleep 2
          done

          echo "----- container logs -----"
          docker logs tad-smoke || true
          echo "--------------------------"

          if [ "$ok" -ne 1 ]; then
            echo "::error::Container did not serve HTTP within 120s."
            exit 1
          fi

          # Migrations must have created the SQLite file (HeadlessPaths.cs:23).
          if [ ! -f /tmp/tad-data/tad.db ]; then
            echo "::error::tad.db was not created — schema migration did not run."
            exit 1
          fi

          # Serilog rolling file sink must be writing (Program.cs:18-22).
          if ! ls /tmp/tad-data/logs/headless-*.log >/dev/null 2>&1; then
            echo "::warning::No rolling log file found under /data/logs."
          fi

          # Startup must be clean of fatals.
          if docker logs tad-smoke 2>&1 | grep -qE '\[FTL\]|Unhandled exception'; then
            echo "::error::Fatal error during container startup."
            exit 1
          fi
          echo "Smoke test passed."

      - name: Tear down
        if: always()
        run: docker rm -f tad-smoke || true

  # ───────────────────────────────────────────────────────────────────────────
  # 6. Required-check aggregator — set THIS as the single branch-protection gate
  # ───────────────────────────────────────────────────────────────────────────
  pr-gate:
    name: PR gate
    if: always()
    needs: [build-test, dependency-scan, secret-scan, container-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        shell: bash
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -qE '"result":\s*"(failure|cancelled)"'; then
            echo "::error::One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed."
