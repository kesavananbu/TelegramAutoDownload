# Build and publish the Headless container image to GitHub Container Registry (GHCR).
# WPF desktop releases remain in release-desktop.yml.
name: Docker Publish

on:
  pull_request:
    branches: [main, master, enterprise-readiness]
  push:
    branches: [main, master, enterprise-readiness]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    concurrency:
      group: docker-publish-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Normalise GHCR image name (lowercase)
        shell: bash
        run: echo "IMAGE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=Telegram Auto Download (Headless)
            org.opencontainers.image.description=Monitors Telegram chats and auto-downloads media via a web dashboard (container/headless deployment)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build (and push on non-PR events)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Job summary
        if: always()
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          {
            echo "### Docker build (${{ matrix.platform }})"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Platform | \`${{ matrix.platform }}\` |"
            echo "| Runner | \`${{ matrix.runner }}\` |"
            echo "| Image | \`${IMAGE:-unknown}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Push | \`${{ github.event_name != 'pull_request' }}\` |"
            echo "| Outcome | \`${{ steps.build.outcome }}\` |"
            if [ "${{ steps.build.outcome }}" = "success" ] && [ -n "${{ steps.build.outputs.digest }}" ]; then
              echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            fi
            if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Docker publish gate
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform builds
        shell: bash
        run: |
          echo "Matrix job result: ${{ needs.build.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more platform image builds failed."
            exit 1
          fi
          echo "All platform builds succeeded (${PLATFORMS})."
        env:
          PLATFORMS: ${{ env.PLATFORMS }}

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Docker publish"
            echo ""
            echo "Published platforms: \`${PLATFORMS}\`"
            echo ""
            echo "ARMv7 (\`linux/arm/v7\`) is **not** built in CI: emulated \`apt-get install ffmpeg\` on GitHub-hosted runners is unreliable (SIGKILL/OOM). Build on real armhf hardware locally if needed."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PLATFORMS: ${{ env.PLATFORMS }}
