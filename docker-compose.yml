# Pull the prebuilt multi-arch image from GHCR (recommended for Synology Container Manager
# and other hosts). Replace GHCR_IMAGE if you use a fork or pin a version tag.
services:
  telegram-auto-download:
    image: ${GHCR_IMAGE:-ghcr.io/il90il90/telegramautodownload:latest}
    container_name: telegram-auto-download
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      DOWNLOADS_DIR: /downloads
      LISTEN_URL: http://0.0.0.0:8080
      WEB_USERNAME: ${WEB_USERNAME:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:-changeme}
      WEB_AUTH_ENABLED: ${WEB_AUTH_ENABLED:-true}
      WEB_SESSION_DAYS: ${WEB_SESSION_DAYS:-7}
      WEB_AUTH_SECURE_COOKIES: ${WEB_AUTH_SECURE_COOKIES:-false}
      APP_ID: ${APP_ID:-}
      API_HASH: ${API_HASH:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      TZ: ${TZ:-}
    volumes:
      - ${DATA_VOLUME:-./data}:/data
      - ${DOWNLOADS_VOLUME:-./downloads}:/downloads
    # Optional: match host UID/GID on Synology/NAS (example: user: "1029:100")
    # user: "1000:1000"
